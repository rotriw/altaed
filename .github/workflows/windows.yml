name: Windows development build

on:
  workflow_dispatch:
    inputs:
      release:
        description: Also build the release executable (not an installer)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
  PYTHONUTF8: '1'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.93 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup target add x86_64-pc-windows-msvc --toolchain 1.93
          if ($LASTEXITCODE -ne 0) { throw 'Windows target installation failed' }
      - name: Restore Cargo dependencies and build cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-msvc-rust1.93-nodebug-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'vendor/zed-source.json', 'scripts/patch_editor_baseline.py') }}
          restore-keys: windows-msvc-rust1.93-nodebug-
      - name: Prepare public editor source and MSVC
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/check_windows.ps1 -Stage prepare
      - name: Check all crates
        timeout-minutes: 25
        shell: pwsh
        run: ./scripts/check_windows.ps1 -Stage check
      - name: Run all tests
        timeout-minutes: 30
        shell: pwsh
        run: ./scripts/check_windows.ps1 -Stage test
      - name: Build development executable
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/check_windows.ps1 -Stage build
      - name: Check Clippy
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/check_windows.ps1 -Stage clippy
      - name: Probe real clangd
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/check_windows.ps1 -Stage probe
      - name: Build release executable
        if: ${{ inputs.release }}
        timeout-minutes: 45
        shell: pwsh
        run: ./scripts/check_windows.ps1 -Stage release
      - name: Save logs and development executable
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: altaed-windows-development
          retention-days: 14
          path: |
            evidence/windows/
            target/x86_64-pc-windows-msvc/debug/altaed.exe
            target/x86_64-pc-windows-msvc/release/altaed.exe
            THIRD_PARTY_NOTICES.md
            crates/altaed/languages/LICENSE-GPL
            crates/altaed/assets/LICENSE-IBM-PLEX.txt
          if-no-files-found: warn
      - name: Preserve dependencies for the next attempt
        if: always() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
