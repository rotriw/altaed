<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>欢迎使用 altaed</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="style.css"></head><body>
<div class="prototype"><span>欢迎界面原型 · 环境检测与保存为演示</span><label>检测状态 <select id="preview-state"><option value="pending">待验证</option><option value="checking">检测中</option><option value="ready">通过</option><option value="error">失败</option><option value="save-error">保存失败</option></select></label></div>
<section class="welcome" aria-label="欢迎使用 altaed"><div class="welcome-banner" aria-hidden="true"><span>A</span><span>L</span><span>T</span><span>A</span><span>E</span><span>D</span></div>
<main id="welcome-page" class="hero"><div class="hero-copy"><h1><span>欢迎使用</span><span class="wordmark"><img src="welcome-wordmark.svg" alt="altaed"></span></h1><p>你的本地竞赛编程 IDE。</p></div></main>
<main id="environment-page" hidden><h2>配置编译环境</h2><p class="intro">检测本地 C++ 编译器，也可以稍后配置。</p><section class="environment"><label for="compiler">C++ 编译器</label><div class="path-row"><input id="compiler" class="control" value="/usr/bin/clang++" placeholder="clang++ / g++ 或完整路径" spellcheck="false" autocomplete="off"><button id="choose">选择文件…</button></div><div class="environment-actions"><button id="detect">自动查找</button><button id="verify" class="outlined">验证环境</button></div><div id="environment-status" role="status" aria-live="polite"><img id="success-icon" src="success.svg" alt="" aria-hidden="true" width="18" height="18" hidden><span id="environment-message"></span></div></section></main>
<main id="shortcuts-page" hidden><h2>确认执行快捷键</h2><p class="intro">随时可在软件设置中修改。</p><table class="shortcuts"><thead><tr><th>命令</th><th>快捷键</th><th>行为</th></tr></thead><tbody></tbody></table><p class="shortcut-note">使用 cmd / ctrl / alt / shift 组合，留空可停用。</p><div class="config-row"><p>配置保存在本机。</p><button id="config">显示 config.json</button></div><p id="shortcut-error" role="alert"></p></main>
<footer><button id="back">退出</button><span id="footer-status"></span><button id="skip" hidden>稍后配置</button><button id="continue" class="primary">开始配置</button></footer></section><script type="module" src="app.js"></script></body></html>
