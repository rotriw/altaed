[workspace]
members = ["crates/altaed", "crates/altaed-core"]
default-members = ["crates/altaed"]
exclude = ["vendor/zed"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
altaed-core = { path = "crates/altaed-core" }
anyhow = "=1.0.100"
assets = { path = "vendor/zed/crates/assets" }
base64 = "=0.22.1"
editor = { path = "vendor/zed/crates/editor" }
futures = "=0.3.31"
gpui = { path = "vendor/zed/crates/gpui" }
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["font-kit"] }
language = { path = "vendor/zed/crates/language" }
libc = "=0.2.177"
lsp = { path = "vendor/zed/crates/lsp" }
parking_lot = "=0.12.5"
project = { path = "vendor/zed/crates/project" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
settings = { path = "vendor/zed/crates/settings" }
theme = { path = "vendor/zed/crates/theme" }
toml = "=0.8.23"
tree-sitter-cpp = { git = "https://github.com/tree-sitter/tree-sitter-cpp", rev = "5cb9b693cfd7bfacab1d9ff4acac1a4150700609" }
ui = { path = "vendor/zed/crates/ui" }
util = { path = "vendor/zed/crates/util" }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
notify = { git = "https://github.com/zed-industries/notify.git", rev = "ce58c24cad542c28e04ced02e20325a4ec28a31d" }
notify-types = { git = "https://github.com/zed-industries/notify.git", rev = "ce58c24cad542c28e04ced02e20325a4ec28a31d" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "eb6b4fd17b9af5ecc226546bdd04185391b3e265" }
